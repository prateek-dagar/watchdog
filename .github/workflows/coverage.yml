name: Coverage

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test-coverage:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runs-on }}
    if: "!startsWith(github.head_ref, 'all-contributors/') && !startsWith(github.event.pull_request.title, 'docs:')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            id: linux
            emoji: 🐧
            runs-on: ubuntu-latest
          - name: macOS
            id: macos
            emoji: 🍎
            runs-on: macos-latest
          - name: Windows
            id: windows
            emoji: 🪟
            runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[watchmedo]' -r requirements-tests.txt

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: ".coverage.${{ matrix.os.id }}"
        run: |
          python -m pytest --cov=watchdog --cov-report=term

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os.name }}
          path: .coverage.${{ matrix.os.id }}
          include-hidden-files: true

  report-coverage:
    name: 📊 Combined Coverage & Summary
    needs: test-coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install coverage tools
        run: python -m pip install "coverage[toml]"

      - name: Download all OS coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Calculate OS Breakdown, Combine Coverage & Build Markdown Comment
        run: |
          python -c "
          import os, subprocess, json

          results = {}
          os_list = [('Linux', '🐧', '.coverage.linux'), ('macOS', '🍎', '.coverage.macos'), ('Windows', '🪟', '.coverage.windows')]

          for os_name, emoji, cov_file in os_list:
              if os.path.exists(cov_file):
                  try:
                      subprocess.run(['coverage', 'json', f'--data-file={cov_file}', '-o', f'cov_{os_name}.json'], check=True)
                      with open(f'cov_{os_name}.json') as f:
                          d = json.load(f)
                      results[os_name] = {'emoji': emoji, 'pct': f\"{d['totals']['percent_covered']:.2f}%\", 'status': '✅ Passed'}
                  except Exception:
                      results[os_name] = {'emoji': emoji, 'pct': 'N/A', 'status': '❌ Failed'}
              else:
                  results[os_name] = {'emoji': emoji, 'pct': 'N/A', 'status': '❌ Missing'}

          # Combine for global coverage
          subprocess.run(['coverage', 'combine'], check=False)
          subprocess.run(['coverage', 'json', '-o', 'cov_global.json'], check=False)

          global_pct = 'N/A'
          files_table = ''
          if os.path.exists('cov_global.json'):
              try:
                  with open('cov_global.json') as f:
                      gd = json.load(f)
                  global_pct = f\"{gd['totals']['percent_covered']:.2f}%\"

                  # Build top uncovered files table
                  files = []
                  for filepath, finfo in gd.get('files', {}).items():
                      rel_path = filepath
                      if 'watchdog/' in filepath:
                          rel_path = 'src/watchdog/' + filepath.split('watchdog/')[-1]
                      pct = finfo['summary']['percent_covered']
                      missing = finfo['summary']['missing_lines']
                      stmts = finfo['summary']['num_statements']
                      missing_ranges = finfo.get('missing_lines', [])
                      if missing > 0:
                          files.append((pct, rel_path, stmts, missing))

                  files.sort(key=lambda x: (x[0], -x[3]))
                  if files:
                      files_table = '\n<details>\n<summary>📁 View Uncovered Files / Line Stats</summary>\n\n'
                      files_table += '| File | Statements | Missing | Coverage |\n| :--- | :---: | :---: | :---: |\n'
                      for pct, rpath, stmts, missing in files:
                          files_table += f'| `{rpath}` | {stmts} | {missing} | **{pct:.1f}%** |\n'
                      files_table += '\n</details>\n'
              except Exception as e:
                  print(f'Error reading global coverage json: {e}')

          # Build final Markdown comment
          comment = '## 📊 Python Test Coverage Report\n\n'
          comment += f'### 🌐 Multi-OS Combined Coverage: **{global_pct}**\n\n'
          comment += '### 🖥️ OS-Level Breakdown\n'
          comment += '| OS | Status | Coverage |\n| :--- | :---: | :---: |\n'
          for os_name, emoji, _ in os_list:
              info = results[os_name]
              comment += f\"| {info['emoji']} {os_name} | {info['status']} | **{info['pct']}** |\n\"

          comment += files_table
          comment += '\n\n<!-- watchdog-coverage-comment -->\n'

          with open('coverage_comment.md', 'w') as f:
              f.write(comment)
          "

      - name: Add Coverage to Step Summary
        if: always()
        run: |
          if [ -f coverage_comment.md ]; then
            cat coverage_comment.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (!fs.existsSync('coverage_comment.md')) {
              console.log('No coverage_comment.md file found.');
              return;
            }
            const body = fs.readFileSync('coverage_comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const botComment = comments.data.find(comment =>
              comment.body && comment.body.includes('<!-- watchdog-coverage-comment -->')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: body,
              });
              console.log('Updated existing coverage comment.');
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: body,
              });
              console.log('Created new coverage comment.');
            }

