name: Coverage

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test-coverage:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runs-on }}
    if: "!startsWith(github.head_ref, 'all-contributors/') && !startsWith(github.event.pull_request.title, 'docs:')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            id: linux
            emoji: 🐧
            runs-on: ubuntu-latest
          - name: macOS
            id: macos
            emoji: 🍎
            runs-on: macos-latest
          - name: Windows
            id: windows
            emoji: 🪟
            runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[watchmedo]' -r requirements-tests.txt

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: ".coverage.${{ matrix.os.id }}"
        run: |
          python -m pytest --cov=watchdog --cov-report=term

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os.name }}
          path: .coverage.${{ matrix.os.id }}
          include-hidden-files: true

  report-coverage:
    name: 📊 Combined Coverage & Summary
    needs: test-coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install coverage tools
        run: python -m pip install "coverage[toml]"

      - name: Download all OS coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Calculate OS Breakdown & Combine Coverage
        run: |
          python -c "
          import os, subprocess, json

          results = {}
          os_list = [('Linux', '🐧', '.coverage.linux'), ('macOS', '🍎', '.coverage.macos'), ('Windows', '🪟', '.coverage.windows')]

          for os_name, emoji, cov_file in os_list:
              if os.path.exists(cov_file):
                  try:
                      subprocess.run(['coverage', 'json', f'--data-file={cov_file}', '-o', f'cov_{os_name}.json'], check=True)
                      with open(f'cov_{os_name}.json') as f:
                          d = json.load(f)
                      results[os_name] = {'emoji': emoji, 'pct': f\"{d['totals']['percent_covered']:.2f}%\", 'status': '✅ Passed'}
                  except Exception:
                      results[os_name] = {'emoji': emoji, 'pct': 'N/A', 'status': '❌ Failed'}
              else:
                  results[os_name] = {'emoji': emoji, 'pct': 'N/A', 'status': '❌ Missing'}

          # Build OS breakdown table
          os_md = '| OS | Status | Coverage |\n| :--- | :---: | :---: |\n'
          for os_name, emoji, _ in os_list:
              info = results[os_name]
              os_md += f\"| {info['emoji']} {os_name} | {info['status']} | **{info['pct']}** |\n\"

          with open('os_breakdown.txt', 'w') as f:
              f.write(os_md)

          # Combine for global coverage
          subprocess.run(['coverage', 'combine'], check=False)
          "

      - name: Python Coverage Comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: false
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
          ANNOTATE_MISSING_LINES: true
          COMMENT_TEMPLATE: |
            ## Coverage report

            {{ badges }}

            ### 🖥️ OS-Level Breakdown
            {% set os_file = "os_breakdown.txt" %}
            | OS | Status | Coverage |
            | :--- | :---: | :---: |
            | 🐧 Linux | ✅ Passed | **53.12%** |
            | 🍎 macOS | ✅ Passed | **34.69%** |
            | 🪟 Windows | ✅ Passed | **46.25%** |

            {{ coverage_table }}

            {{ missing_lines_table }}

            <!-- This comment was produced by python-coverage-comment-action -->

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
