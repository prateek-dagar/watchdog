name: Coverage

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test-coverage:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runs-on }}
    if: "!startsWith(github.head_ref, 'all-contributors/') && !startsWith(github.event.pull_request.title, 'docs:')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            id: linux
            emoji: 🐧
            runs-on: ubuntu-latest
          - name: macOS
            id: macos
            emoji: 🍎
            runs-on: macos-latest
          - name: Windows
            id: windows
            emoji: 🪟
            runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[watchmedo]' -r requirements-tests.txt

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=watchdog --cov-report=term

      - name: Post OS-Specific Coverage Comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBPROJECT_ID: ${{ matrix.os.id }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
          ANNOTATE_MISSING_LINES: true
