name: Coverage

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test-coverage:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runs-on }}
    if: "!startsWith(github.head_ref, 'all-contributors/') && !startsWith(github.event.pull_request.title, 'docs:')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            id: linux
            emoji: 🐧
            runs-on: ubuntu-latest
          - name: macOS
            id: macos
            emoji: 🍎
            runs-on: macos-latest
          - name: Windows
            id: windows
            emoji: 🪟
            runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[watchmedo]' -r requirements-tests.txt

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: ".coverage.${{ matrix.os.id }}"
        run: |
          python -m pytest --cov=watchdog --cov-report=term

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os.name }}
          path: .coverage.${{ matrix.os.id }}
          include-hidden-files: true

  report-coverage:
    name: 📊 Combined Coverage & Summary
    needs: test-coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install coverage
        run: python -m pip install "coverage[toml]"

      - name: Download all OS coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine and Report OS Breakdown
        run: |
          coverage combine --keep
          echo "### 🖥️ OS Coverage Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "| OS | Coverage |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          for os in linux macos windows; do
            if [ -f ".coverage.$os" ]; then
              pct=$(coverage report --data-file=".coverage.$os" | awk '/TOTAL/ {print $4}')
              echo "| $os | $pct |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


