name: Coverage

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  test-coverage:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }}
    runs-on: ${{ matrix.os.runs-on }}
    if: "!startsWith(github.head_ref, 'all-contributors/') && !startsWith(github.event.pull_request.title, 'docs:')"
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            emoji: 🐧
            runs-on: ubuntu-latest
          - name: macOS
            emoji: 🍎
            runs-on: macos-latest
          - name: Windows
            emoji: 🪟
            runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[watchmedo]' -r requirements-tests.txt

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=watchdog --cov-report=term
          mv .coverage .coverage.${{ matrix.os.matrix }}

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os.name }}
          path: .coverage.${{ matrix.os.matrix }}
          include-hidden-files: true

  report-coverage:
    name: 📊 Combined Coverage & Summary
    needs: test-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install coverage tools
        run: python -m pip install "coverage[toml]"

      - name: Download all OS coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage & generate file-wise report
        run: |
          ls -la .coverage*
          python -m coverage combine
          python -m coverage xml -o coverage.xml
          echo "### 📊 Combined OS-level & File-wise Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Python Coverage Comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@a05be3d2e8a6272d3ef5fb2840ab20368bb2eb71 # v4.3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COVERAGE_FILES: true
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
          ANNOTATE_MISSING_LINES: true

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
