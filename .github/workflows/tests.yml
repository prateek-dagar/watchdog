name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

# No job requires write access to the GITHUB_TOKEN; checkout only needs contents: read.
permissions:
  contents: read

jobs:
  quality:
    name: 🧑‍🏭 Quality & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install tox

      - name: Run linters
        run: python -m tox -q -e types,lint

      - name: Build the documentation
        run: python -m tox -q -e docs

  tox:
    name: ${{ matrix.tox.name }} ${{ matrix.os.emoji }} ${{ matrix.os.name }} ${{ matrix.python }}
    runs-on: ${{ matrix.os.runs-on }}
    if: "!startsWith(github.head_ref, 'all-contributors/') && !startsWith(github.event.pull_request.title, 'docs:')"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: macOS
            matrix: macos
            emoji: 🍎
            runs-on: [macos-latest]
          # - name: Windows
          #   matrix: windows
          #   emoji: 🪟
          #   runs-on: [windows-latest]
        python:
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: python -m pip install tox

      - name: Run tests
        run: python -m tox -q -e py
